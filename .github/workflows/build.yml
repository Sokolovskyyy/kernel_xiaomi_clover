name: Build Clover Kernel

on:
  workflow_dispatch:
    inputs:
      local_version:
        description: 'Custom local version suffix (e.g. -ksunext-test1). Leave empty for default.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  get-manager:
    uses: ./.github/workflows/get-manager.yml

  build:
    needs: get-manager
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      CC: clang
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: AlcatrazDev-Android-Devices/kernel_xiaomi_clover
          ref: lineage-23.1
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev libelf-dev \
            build-essential git curl wget python3 python-is-python3 cpio rsync \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libtinfo5 zip unzip

      - name: Get toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Add toolchain to GITHUB_PATH
        run: |
          echo "${{ github.workspace }}/toolchain/bin" >> $GITHUB_PATH

      - name: Integrate KernelSU-Next (legacy driver for non-GKI)
        working-directory: kernel
        run: |
          rm -rf drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          echo "=== drivers/kernelsu symlink ==="
          ls -la drivers/kernelsu
          echo "=== Kconfig entry ==="
          grep "kernelsu" drivers/Kconfig
          echo "=== Makefile entry ==="
          grep "kernelsu" drivers/Makefile
          echo "=== drivers/kernelsu/Kconfig ==="
          cat drivers/kernelsu/Kconfig

      - name: Add SUSFS menu to KernelSU-Next Kconfig
        working-directory: kernel
        run: |
          KCONFIG="drivers/kernelsu/Kconfig"

          if grep -q "config KSU_SUSFS" "$KCONFIG"; then
            echo "SUSFS menu already present in Kconfig - skipping injection"
          else
            # Write SUSFS menu to temp file (avoids quoting issues)
            cat > /tmp/susfs_menu.kconfig << 'SUSFS_EOF'
          
          menu "KernelSU - SUSFS"
          
          config KSU_SUSFS
          	bool "KernelSU addon - SUSFS"
          	depends on KSU
          	depends on 64BIT
          	default y
          	help
          	  Patch and Enable SUSFS to kernel with KernelSU.
          
          config KSU_SUSFS_SUS_PATH
          	bool "Enable to hide suspicious path (NOT recommended)"
          	depends on KSU_SUSFS
          	default y
          	help
          	  Allow hiding the user-defined path and all its sub-paths from various system calls.
          
          config KSU_SUSFS_SUS_MOUNT
          	bool "Enable to hide suspicious mounts"
          	depends on KSU_SUSFS
          	default y
          	help
          	  Allow hiding the user-defined mount paths from /proc/self/[mounts|mountinfo|mountstat].
          
          config KSU_SUSFS_SUS_KSTAT
          	bool "Enable to spoof suspicious kstat"
          	depends on KSU_SUSFS
          	default y
          	help
          	  Allow spoofing the kstat of user-defined file/directory.
          
          config KSU_SUSFS_TRY_UMOUNT
          	bool "Enable to use ksu's try_umount"
          	depends on KSU_SUSFS
          	default y
          	help
          	  Allow using try_umount to umount user-defined mount paths.
          
          config KSU_SUSFS_SPOOF_UNAME
          	bool "Enable to spoof uname"
          	depends on KSU_SUSFS
          	default y
          	help
          	  Allow spoofing the string returned by uname syscall.
          
          config KSU_SUSFS_ENABLE_LOG
          	bool "Enable logging susfs log to kernel"
          	depends on KSU_SUSFS
          	default y
          	help
          	  Allow logging susfs log to kernel.
          
          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          	bool "Enable to hide ksu and susfs symbols from /proc/kallsyms"
          	depends on KSU_SUSFS
          	default y
          	help
          	  Automatically hide ksu and susfs symbols from /proc/kallsyms.
          
          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	bool "Enable to spoof /proc/cmdline (non-gki)"
          	depends on KSU_SUSFS
          	default y
          	help
          	  Spoof the output of /proc/cmdline with a user-defined file.
          
          config KSU_SUSFS_OPEN_REDIRECT
          	bool "Enable to redirect a path to be opened with another path (experimental)"
          	depends on KSU_SUSFS
          	default y
          	help
          	  Allow redirecting a target path to be opened with another user-defined path.
          
          config KSU_SUSFS_SUS_MAP
          	bool "Enable to hide some mmapped real file from different proc maps interfaces"
          	depends on KSU_SUSFS
          	default y
          	help
          	  Allow hiding mmapped real file from /proc/<pid>/[maps|smaps|smaps_rollup|map_files|mem|pagemap]
          
          endmenu
          SUSFS_EOF

            # Insert SUSFS menu before the final endmenu
            python3 -c "
          kconfig_path = '$KCONFIG'
          with open(kconfig_path, 'r') as f:
              content = f.read()
          susfs_menu = open('/tmp/susfs_menu.kconfig').read()
          stripped = content.rstrip()
          if stripped.endswith('endmenu'):
              # Keep the original endmenu (closes KernelSU menu), insert SUSFS before it
              content = stripped[:-7] + susfs_menu + '\nendmenu\n'
          else:
              content += susfs_menu
          with open(kconfig_path, 'w') as f:
              f.write(content)
          print('Added SUSFS menu to KernelSU-Next Kconfig')
          "

            # Fix THREAD_INFO_IN_TASK dependency (does not exist in 4.19)
            python3 -c "
          kconfig_path = '$KCONFIG'
          with open(kconfig_path, 'r') as f:
              content = f.read()
          changed = False
          if 'depends on THREAD_INFO_IN_TASK && 64BIT' in content:
              content = content.replace('depends on THREAD_INFO_IN_TASK && 64BIT', 'depends on 64BIT')
              changed = True
          elif 'depends on THREAD_INFO_IN_TASK' in content:
              content = content.replace('depends on THREAD_INFO_IN_TASK', 'depends on 64BIT')
              changed = True
          if changed:
              with open(kconfig_path, 'w') as f:
                  f.write(content)
              print('Fixed THREAD_INFO_IN_TASK dependency -> 64BIT')
          else:
              print('No THREAD_INFO_IN_TASK dependency found (already correct)')
          "
          fi

          echo "=== Final drivers/kernelsu/Kconfig ==="
          cat "$KCONFIG"

      - name: "Apply official KernelSU-Next manual hooks (5 files)"
        working-directory: kernel
        shell: bash
        run: |
          python3 << 'PYEOF'
          """
          Apply 5 official KernelSU-Next legacy manual hooks.
          Replaces old ReSukiSU/AlcatrazDev hooks that use undefined symbols.

          For each file:
            1. Strip old AlcatrazDev CONFIG_KSU blocks (if present)
            2. Insert official KernelSU-Next hook at canonical anchor
            3. If anchor NOT found -> FATAL WARNING with surrounding context (no silent skip)
          """
          import re, sys, os

          results = []

          # ── helpers ──────────────────────────────────────────────────
          def read_file(path):
              with open(path, 'r', encoding='utf-8', errors='surrogateescape') as f:
                  return f.read()

          def write_file(path, content):
              with open(path, 'w', encoding='utf-8', errors='surrogateescape') as f:
                  f.write(content)

          def show_context(content, anchor_text, context_lines=8):
              """Print surrounding lines around anchor_text in content."""
              lines = content.split('\n')
              for i, line in enumerate(lines):
                  if anchor_text in line:
                      start = max(0, i - context_lines)
                      end = min(len(lines), i + context_lines + 1)
                      print(f"    Context (lines {start+1}-{end}):")
                      for j in range(start, end):
                          marker = ">>>" if j == i else "   "
                          print(f"      {marker} {j+1}: {lines[j]}")
                      return True
              print(f"    Anchor '{anchor_text}' not found anywhere in file.")
              print(f"    First 40 lines for reference:")
              for i, line in enumerate(lines[:40]):
                  print(f"      {i+1}: {line}")
              return False

          def strip_ksu_blocks(content, tag):
              """Remove old CONFIG_KSU / KSU blocks from file."""
              orig_len = len(content)
              content = re.sub(r'\n#ifdef CONFIG_KSU.*?#endif\n', '\n', content, flags=re.DOTALL)
              content = re.sub(r'\n#if defined\(KSU\).*?#endif\n', '\n', content, flags=re.DOTALL)
              for dead in ['ksu_execveat_hook', 'ksu_vfs_read_hook', 'ksu_input_hook']:
                  content = re.sub(rf'\n.*extern.*{re.escape(dead)}.*\n', '\n', content)
              diff = orig_len - len(content)
              if diff > 0:
                  print(f"  [{tag}] Stripped {diff} bytes of old CONFIG_KSU blocks")
              else:
                  print(f"  [{tag}] No old CONFIG_KSU blocks found (clean)")
              return content

          def find_line(lines, anchor):
              """Return index of first line containing anchor, or None."""
              for i, line in enumerate(lines):
                  if anchor in line:
                      return i
              return None

          def skip_declarations(lines, start, max_lines=30):
              """From start, skip past C90 declarations (struct/int/etc lines ending with ;).
              Return index of first executable/non-declaration line."""
              decl_re = re.compile(
                  r'^\s*(static\s+)?(const\s+)?'
                  r'(struct|union|enum|int|unsigned|signed|long|short|char|void|'
                  r'size_t|ssize_t|loff_t|pid_t|bool|u32|u64|__u\d+|dev_t|'
                  r'mm_segment_t|struct\s+\w+)\s+'
              )
              for i in range(start, min(start + max_lines, len(lines))):
                  stripped = lines[i].strip()
                  if not stripped or stripped.startswith('//') or stripped.startswith('/*') or stripped.startswith('*'):
                      continue
                  if stripped == '{':
                      continue
                  if stripped.startswith('#'):
                      continue
                  # Lines ending with ; that look like declarations
                  if decl_re.match(stripped):
                      continue
                  # Simple heuristic: if it has = and ;, probably a declaration
                  if '=' in stripped and stripped.endswith(';') and 'return' not in stripped:
                      continue
                  # This looks like executable code
                  return i
              return start  # fallback

          # ═══════════════════════════════════════════════════════════════
          # 1. fs/exec.c — ksu_handle_execveat
          # ═══════════════════════════════════════════════════════════════
          TAG = 'fs/exec.c'
          HOOK = 'ksu_handle_execveat'
          print(f"=== Hook 1/5: {TAG} — {HOOK} ===")
          ok_exec = False

          try:
              c = read_file(TAG)
          except FileNotFoundError:
              print(f"  ❌  FATAL: {TAG} not found!")
              results.append((TAG, HOOK, False)); ok_exec = False; c = None

          if c is not None:
              c = strip_ksu_blocks(c, TAG)
              lines = c.split('\n')

              # --- do_execveat_common: search flexibly for any return call ---
              # In 4.19 kernels this may be:
              #   return do_execve(filename, argv, envp);
              #   return __do_execve_file(fd, filename, argv, envp, flags, NULL);
              #   return do_execveat_common(...)

              de_idx = find_line(lines, 'do_execveat_common')
              main_hook_ok = False
              if de_idx is not None:
                  # Search within next 80 lines for any return statement with do_execve or __do_execve
                  for i in range(de_idx, min(de_idx + 80, len(lines))):
                      m = re.search(r'return\s+(__)?do_execve\w*\s*\(', lines[i])
                      if m:
                          anchor_line = lines[i].rstrip()
                          hook_block = (
                              "#ifdef CONFIG_KSU\n"
                              "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                              "#endif\n"
                              f"\t{anchor_line}"
                          )
                          lines[i] = hook_block
                          c = '\n'.join(lines)
                          print(f"  [{TAG}] {HOOK} inserted in do_execveat_common ✓")
                          print(f"    anchored on: {anchor_line.strip()}")
                          main_hook_ok = True
                          break
                  if not main_hook_ok and de_idx is not None:
                      print(f"  [{TAG}] ⚠ WARNING: no 'return do_execve*' found inside do_execveat_common")
                      start = max(0, de_idx - 2)
                      end = min(len(lines), de_idx + 20)
                      print(f"    Context (lines {start+1}-{end}):")
                      for j in range(start, end):
                          marker = ">>>" if j == de_idx else "   "
                          print(f"      {marker} {j+1}: {lines[j]}")
              else:
                  # Fallback: search for any return do_execve* line anywhere
                  for i, line in enumerate(lines):
                      m = re.search(r'return\s+(__)?do_execve\w*\s*\(', line)
                      if m:
                          anchor_line = line.rstrip()
                          hook_block = (
                              "#ifdef CONFIG_KSU\n"
                              "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                              "#endif\n"
                              f"\t{anchor_line}"
                          )
                          preceding = '\n'.join(lines[max(0, i-500):i])
                          if 'execveat_common' in preceding:
                              lines[i] = hook_block
                              c = '\n'.join(lines)
                              print(f"  [{TAG}] {HOOK} inserted (fallback search) ✓")
                              print(f"    anchored on: {anchor_line.strip()}")
                              main_hook_ok = True
                          break
                  if not main_hook_ok:
                      print(f"  [{TAG}] ❌ FATAL: no 'return do_execve*' found anywhere in file")
                      for i, line in enumerate(lines):
                          if 'do_execveat_common' in line:
                              start = max(0, i - 2)
                              end = min(len(lines), i + 30)
                              print(f"    Context around do_execveat_common (lines {start+1}-{end}):")
                              for j in range(start, end):
                                  marker = ">>>" if j == i else "   "
                                  print(f"      {marker} {j+1}: {lines[j]}")
                              break

              ok_exec = main_hook_ok

              # --- compat_do_execve: search flexibly ---
              # Found in CI: "return compat_do_execve(getname(filename), argv, envp);"
              # NOTE: compat_do_execve has NO fd or flags params — pass NULL
              compat_m = re.search(r'return\s+compat_do_execve\s*\(', c)
              if compat_m:
                  compat_line_idx = None
                  for i, line in enumerate(c.split('\n')):
                      if compat_m.group() in line:
                          compat_line_idx = i
                          break
                  if compat_line_idx is not None:
                      lines = c.split('\n')
                      anchor_line = lines[compat_line_idx].rstrip()
                      if HOOK not in lines[max(0, compat_line_idx-5):compat_line_idx+1][0] if compat_line_idx > 0 else True:
                          hook_block = (
                              "#ifdef CONFIG_KSU\n"
                              "\tksu_handle_execveat(NULL, NULL, &argv, &envp, NULL);\n"
                              "#endif\n"
                              f"\t{anchor_line}"
                          )
                          lines[compat_line_idx] = hook_block
                          c = '\n'.join(lines)
                          print(f"  [{TAG}] compat hook inserted ✓")
                          print(f"    anchored on: {anchor_line.strip()}")

              # --- Insert extern declarations ---
              # Place at top of file after last #include, NOT before
              # SYSCALL_DEFINE3(execve) which may come AFTER do_execveat_common
              if "extern int ksu_handle_execveat" not in c:
                  extern_block = (
                      "#ifdef CONFIG_KSU\n"
                      "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                      "#endif\n"
                  )
                  lines = c.split('\n')
                  last_include_idx = None
                  for i, line in enumerate(lines):
                      if line.startswith('#include '):
                          last_include_idx = i
                      # Stop at first function definition
                      if re.match(r'^(static\s+|long\s+|int\s+|void\s+|ssize_t\s+)', line.strip()) and i > 10:
                          break
                  if last_include_idx is not None:
                      lines.insert(last_include_idx + 1, extern_block)
                      c = '\n'.join(lines)
                      print(f"  [{TAG}] Inserted extern declaration after includes ✓")
                  else:
                      print(f"  [{TAG}] ⚠ WARNING: could not find #include section for extern placement")

              write_file(TAG, c)
              results.append((TAG, HOOK, ok_exec))

          # ═══════════════════════════════════════════════════════════════
          # 2. fs/open.c — ksu_handle_faccessat
          # ═══════════════════════════════════════════════════════════════
          TAG = 'fs/open.c'
          HOOK = 'ksu_handle_faccessat'
          print(f"\n=== Hook 2/5: {TAG} — {HOOK} ===")
          ok_open = False

          try:
              c = read_file(TAG)
          except FileNotFoundError:
              print(f"  ❌  FATAL: {TAG} not found!")
              results.append((TAG, HOOK, False)); ok_open = False; c = None

          if c is not None:
              c = strip_ksu_blocks(c, TAG)

              if HOOK in c:
                  print(f"  [{TAG}] {HOOK} already present ✓")
                  results.append((TAG, HOOK, True))
              else:
                  lines = c.split('\n')
                  # Find SYSCALL_DEFINE3(faccessat,
                  marker = "SYSCALL_DEFINE3(faccessat,"
                  faccessat_idx = find_line(lines, marker)
                  if faccessat_idx is None:
                      print(f"  [{TAG}] ❌ FATAL: anchor not found:")
                      show_context(c, marker)
                      results.append((TAG, HOOK, False))
                  else:
                      # Brace-count to find end of function
                      brace_count = 0
                      func_end = None
                      in_func = False
                      for i in range(faccessat_idx, min(faccessat_idx + 100, len(lines))):
                          for ch in lines[i]:
                              if ch == '{':
                                  brace_count += 1
                                  in_func = True
                              elif ch == '}':
                                  brace_count -= 1
                                  if in_func and brace_count == 0:
                                      func_end = i
                                      break
                          if func_end is not None:
                              break

                      if func_end is None:
                          print(f"  [{TAG}] ⚠ WARNING: could not find closing brace of faccessat")
                          show_context(c, marker, 15)
                          results.append((TAG, HOOK, False))
                      else:
                          # Find last return before closing brace
                          return_line = None
                          for i in range(func_end - 1, faccessat_idx, -1):
                              if lines[i].strip().startswith('return'):
                                  return_line = i
                                  break

                          if return_line is None:
                              print(f"  [{TAG}] ⚠ WARNING: no return statement before closing brace")
                              results.append((TAG, HOOK, False))
                          else:
                              hook_block = (
                                  "#ifdef CONFIG_KSU\n"
                                  "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
                                  "#endif"
                              )
                              lines.insert(return_line, hook_block)
                              c = '\n'.join(lines)

                              # Insert extern
                              extern_block = (
                                  "#ifdef CONFIG_KSU\n"
                                  "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n"
                                  "#endif"
                              )
                              idx = find_line(lines, marker)
                              if idx is not None:
                                  lines = c.split('\n')
                                  lines.insert(idx, extern_block)
                                  c = '\n'.join(lines)
                                  print(f"  [{TAG}] {HOOK} inserted in SYSCALL_DEFINE3(faccessat) ✓")
                                  results.append((TAG, HOOK, True))
                              else:
                                  print(f"  [{TAG}] {HOOK} inserted (extern skipped — marker shifted) ✓")
                                  results.append((TAG, HOOK, True))

                  write_file(TAG, c)

          # ═══════════════════════════════════════════════════════════════
          # 3. fs/read_write.c — ksu_handle_sys_read + ksu_vfs_read_hook
          # ═══════════════════════════════════════════════════════════════
          TAG = 'fs/read_write.c'
          HOOK = 'ksu_handle_sys_read'
          print(f"\n=== Hook 3/5: {TAG} — {HOOK} ===")
          ok_rw = False

          try:
              c = read_file(TAG)
          except FileNotFoundError:
              print(f"  ❌  FATAL: {TAG} not found!")
              results.append((TAG, HOOK, False)); ok_rw = False; c = None

          if c is not None:
              c = strip_ksu_blocks(c, TAG)

              if HOOK in c and 'ksu_vfs_read_hook' in c:
                  print(f"  [{TAG}] {HOOK} already present ✓")
                  results.append((TAG, HOOK, True))
              else:
                  lines = c.split('\n')
                  # Strategy: hook inside ksys_read() BEFORE vfs_read() call.
                  # In 4.19, SYSCALL_DEFINE3(read) is just `return ksys_read(fd, buf, count);`
                  # The actual vfs_read is in ksys_read() function.

                  # Find ksys_read function definition
                  ksys_read_idx = None
                  for i, line in enumerate(lines):
                      if re.search(r'ssize_t\s+ksys_read\s*\(', line):
                          ksys_read_idx = i
                          break

                  if ksys_read_idx is not None:
                      print(f"  [{TAG}] Found ksys_read at line {ksys_read_idx + 1}")
                      # Find vfs_read call within ksys_read function (next 40 lines)
                      vfs_read_idx = None
                      for i in range(ksys_read_idx, min(ksys_read_idx + 40, len(lines))):
                          if 'vfs_read(' in lines[i] and 'ret' in lines[i]:
                              vfs_read_idx = i
                              break

                      if vfs_read_idx is None:
                          # Fallback: search for any vfs_read( in the function
                          for i in range(ksys_read_idx, min(ksys_read_idx + 40, len(lines))):
                              if 'vfs_read(' in lines[i]:
                                  vfs_read_idx = i
                                  break

                      if vfs_read_idx is None:
                          print(f"  [{TAG}] ⚠ WARNING: 'vfs_read(' not found inside ksys_read()")
                          print(f"    Showing ksys_read context:")
                          for j in range(ksys_read_idx, min(ksys_read_idx + 25, len(lines))):
                              print(f"      {j+1}: {lines[j]}")
                          results.append((TAG, HOOK, False))
                      else:
                          hook_block = (
                              "#ifdef CONFIG_KSU\n"
                              "\tif (unlikely(ksu_vfs_read_hook))\n"
                              "\t\tksu_handle_sys_read(fd, &buf, &count);\n"
                              "#endif"
                          )
                          lines.insert(vfs_read_idx, hook_block)
                          c = '\n'.join(lines)

                          # Insert externs before ksys_read function
                          externs = (
                              "#ifdef CONFIG_KSU\n"
                              "extern bool ksu_vfs_read_hook __read_mostly;\n"
                              "extern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n"
                              "#endif"
                          )
                          lines = c.split('\n')
                          # Re-find ksys_read_idx after insertion
                          for i, line in enumerate(lines):
                              if re.search(r'ssize_t\s+ksys_read\s*\(', line):
                                  lines.insert(i, externs)
                                  c = '\n'.join(lines)
                                  break

                          print(f"  [{TAG}] {HOOK} + ksu_vfs_read_hook inserted in ksys_read() ✓")
                          print(f"    anchored before vfs_read at line {vfs_read_idx + 1}")
                          results.append((TAG, HOOK, True))
                  else:
                      # Fallback: try SYSCALL_DEFINE3(read) as last resort
                      print(f"  [{TAG}] ksys_read() not found, trying SYSCALL_DEFINE3(read) fallback")
                      marker = "SYSCALL_DEFINE3(read,"
                      read_idx = find_line(lines, marker)
                      if read_idx is None:
                          print(f"  [{TAG}] ❌ FATAL: neither ksys_read nor SYSCALL_DEFINE3(read) found")
                          show_context(c, "ksys_read")
                          results.append((TAG, HOOK, False))
                      else:
                          # In this kernel, SYSCALL_DEFINE3(read) likely just calls ksys_read
                          # Show what's actually there
                          print(f"    Showing SYSCALL_DEFINE3(read) context:")
                          for j in range(read_idx, min(read_idx + 10, len(lines))):
                              print(f"      {j+1}: {lines[j]}")
                          results.append((TAG, HOOK, False))

                  write_file(TAG, c)

          # ═══════════════════════════════════════════════════════════════
          # 4. fs/stat.c — ksu_handle_stat
          # ═══════════════════════════════════════════════════════════════
          TAG = 'fs/stat.c'
          HOOK = 'ksu_handle_stat'
          print(f"\n=== Hook 4/5: {TAG} — {HOOK} ===")
          ok_stat = False

          try:
              c = read_file(TAG)
          except FileNotFoundError:
              print(f"  ❌  FATAL: {TAG} not found!")
              results.append((TAG, HOOK, False)); ok_stat = False; c = None

          if c is not None:
              c = strip_ksu_blocks(c, TAG)

              if HOOK in c:
                  print(f"  [{TAG}] {HOOK} already present ✓")
                  results.append((TAG, HOOK, True))
              else:
                  lines = c.split('\n')
                  marker = "SYSCALL_DEFINE4(newfstatat,"
                  nf_idx = find_line(lines, marker)
                  if nf_idx is None:
                      print(f"  [{TAG}] ❌ FATAL: anchor not found:")
                      show_context(c, marker)
                      results.append((TAG, HOOK, False))
                  else:
                      # Find opening brace
                      brace_line = None
                      for i in range(nf_idx, min(nf_idx + 10, len(lines))):
                          if '{' in lines[i]:
                              brace_line = i
                              break

                      if brace_line is None:
                          print(f"  [{TAG}] ⚠ WARNING: opening brace not found after SYSCALL_DEFINE4(newfstatat)")
                          show_context(c, marker, 10)
                          results.append((TAG, HOOK, False))
                      else:
                          hook_block = (
                              "#ifdef CONFIG_KSU\n"
                              "\tksu_handle_stat(&dfd, &filename, &flag);\n"
                              "#endif"
                          )
                          # C90: insert AFTER declarations, not after '{'.
                          # Find 'vfs_fstatat' (first executable) and insert before it.
                          insert_idx = None
                          for i in range(brace_line + 1, min(brace_line + 15, len(lines))):
                              if 'vfs_fstatat' in lines[i] or ('error' in lines[i] and '=' in lines[i] and 'struct' not in lines[i]):
                                  insert_idx = i
                                  break
                          if insert_idx is None:
                              # Fallback: insert after opening brace
                              insert_idx = brace_line + 1
                          lines.insert(insert_idx, hook_block)
                          c = '\n'.join(lines)

                          # Insert extern before marker
                          extern_block = "#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif"
                          lines = c.split('\n')
                          idx = find_line(lines, marker)
                          if idx is not None:
                              lines.insert(idx, extern_block)
                              c = '\n'.join(lines)

                          print(f"  [{TAG}] {HOOK} inserted in SYSCALL_DEFINE4(newfstatat) ✓")
                          results.append((TAG, HOOK, True))

                  write_file(TAG, c)

          # ═══════════════════════════════════════════════════════════════
          # 5. kernel/reboot.c — ksu_handle_sys_reboot
          # ═══════════════════════════════════════════════════════════════
          TAG = 'kernel/reboot.c'
          HOOK = 'ksu_handle_sys_reboot'
          print(f"\n=== Hook 5/5: {TAG} — {HOOK} ===")
          ok_reboot = False

          try:
              c = read_file(TAG)
          except FileNotFoundError:
              print(f"  ❌  FATAL: {TAG} not found!")
              results.append((TAG, HOOK, False)); ok_reboot = False; c = None

          if c is not None:
              c = strip_ksu_blocks(c, TAG)

              if HOOK in c:
                  print(f"  [{TAG}] {HOOK} already present ✓")
                  results.append((TAG, HOOK, True))
              else:
                  lines = c.split('\n')
                  marker = "SYSCALL_DEFINE4(reboot,"
                  rb_idx = find_line(lines, marker)
                  if rb_idx is None:
                      print(f"  [{TAG}] ❌ FATAL: anchor not found:")
                      show_context(c, marker)
                      results.append((TAG, HOOK, False))
                  else:
                      brace_line = None
                      for i in range(rb_idx, min(rb_idx + 10, len(lines))):
                          if '{' in lines[i]:
                              brace_line = i
                              break

                      if brace_line is None:
                          print(f"  [{TAG}] ⚠ WARNING: opening brace not found after SYSCALL_DEFINE4(reboot)")
                          show_context(c, marker, 10)
                          results.append((TAG, HOOK, False))
                      else:
                          # Insert hook AFTER all declarations (C90 compliance)
                          insert_at = skip_declarations(lines, brace_line + 1)
                          hook_block = (
                              "#ifdef CONFIG_KSU\n"
                              "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
                              "#endif"
                          )
                          lines.insert(insert_at, hook_block)
                          c = '\n'.join(lines)

                          extern_block = "#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif"
                          lines = c.split('\n')
                          idx = find_line(lines, marker)
                          if idx is not None:
                              lines.insert(idx, extern_block)
                              c = '\n'.join(lines)

                          print(f"  [{TAG}] {HOOK} inserted after declarations (C90 OK) ✓")
                          print(f"    opened at line {brace_line+1}, hook at line {insert_at+1}")
                          results.append((TAG, HOOK, True))

                  write_file(TAG, c)

          # ═══════════════════════════════════════════════════════════════
          # Summary
          # ═══════════════════════════════════════════════════════════════
          print("\n" + "=" * 60)
          print("HOOK APPLICATION SUMMARY")
          print("=" * 60)
          passed = sum(1 for _, _, ok in results if ok)
          failed = sum(1 for _, _, ok in results if not ok)
          for fname, hook, ok in results:
              status = "✓ PASS" if ok else "❌ FAIL"
              print(f"  {status}  {fname} — {hook}")
          print(f"\n  Total: {passed} passed, {failed} failed out of {len(results)}")
          if failed:
              print(f"\n  ⚠  {failed} hook(s) FAILED — build WILL fail at compile/link time.")
              print("     Review the WARNING / FATAL output above for each failed hook.")
              print("     The failing hook anchor may need manual patching.")
              print("     Build will proceed anyway to see which hooks compile correctly.")
          else:
              print("\n  All 5 hooks applied successfully ✓")
          print("=" * 60)
          PYEOF

      - name: Apply SUSFS backport patch
        working-directory: kernel
        run: |
          curl -LSs -o susfs.patch "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.19.patch"
          patch -p1 --fuzz=3 < susfs.patch || true

      - name: Fix rejected SUSFS hunks manually
        working-directory: kernel
        shell: python
        run: |
          import os

          # --- fs/namespace.c: SUS_MOUNT hook ---
          p = "fs/namespace.c"
          if os.path.exists(p):
              with open(p, "r", encoding="utf-8", errors="surrogateescape") as f:
                  s = f.read()

              # --- Remove duplicate can_umount added by SUSFS patch ---
              import re
              can_umount_matches = list(re.finditer(r'static\s+(inline\s+)?int\s+can_umount\s*\(', s))
              if len(can_umount_matches) >= 2:
                  lines = s.split('\n')
                  def_lines = []
                  for i, line in enumerate(lines):
                      if re.search(r'static\s+(inline\s+)?int\s+can_umount\s*\(', line):
                          def_lines.append(i)
                  if len(def_lines) >= 2:
                      start = def_lines[1]
                      brace_count = 0
                      end = start
                      for i in range(start, len(lines)):
                          brace_count += lines[i].count('{') - lines[i].count('}')
                          if brace_count == 0 and '{' in ''.join(lines[start:i+1]):
                              end = i
                              break
                      print(f"{p}: removing duplicate can_umount at lines {start+1}-{end+1}")
                      del lines[start:end+1]
                      s = '\n'.join(lines)
                      with open(p, "w", encoding="utf-8", errors="surrogateescape") as f:
                          f.write(s)
                  else:
                      print(f"{p}: found {len(def_lines)} can_umount defs, skipping")
              else:
                  print(f"{p}: {len(can_umount_matches)} can_umount definitions found, no duplicate")
              if "CONFIG_KSU_SUSFS_SUS_MOUNT" in s:
                  print(f"{p}: already patched (SUS_MOUNT present)")
              else:
                  # Try the alloc_vfsmnt anchor
                  anchor = "\tmnt = alloc_vfsmnt(name);\n\tif (!mnt)\n\t\treturn ERR_PTR(-ENOMEM);"
                  if anchor in s:
                      replacement = (
                          "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                          "\tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)) {\n"
                          "\t\tif (susfs_is_current_ksu_domain()) {\n"
                          "\t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(name ?: \"none\");\n"
                          "\t\t\tgoto bypass_orig_flow;\n"
                          "\t\t}\n"
                          "\t}\n"
                          "#endif\n"
                          "\tmnt = alloc_vfsmnt(name);\n\n"
                          "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                          "bypass_orig_flow:\n"
                          "#endif\n"
                          "\tif (!mnt)\n\t\treturn ERR_PTR(-ENOMEM);"
                      )
                      with open(p, "w", encoding="utf-8", errors="surrogateescape") as f:
                          f.write(s.replace(anchor, replacement, 1))
                      print(f"{p}: patched manually (SUS_MOUNT)")
                  else:
                      print(f"WARNING: alloc_vfsmnt anchor not found in {p}")
                      print("  Searching for context around alloc_vfsmnt...")
                      lines = s.split('\n')
                      for i, line in enumerate(lines):
                          if 'alloc_vfsmnt' in line:
                              start = max(0, i - 3)
                              end = min(len(lines), i + 6)
                              print(f"  Context around line {i + 1}:")
                              for j in range(start, end):
                                  marker = ">>>" if j == i else "   "
                                  print(f"    {marker} {j + 1}: {lines[j]}")
                              break

          # --- fs/proc/task_mmu.c: OPEN_REDIRECT + SUS_MAP + SUS_KSTAT hooks ---
          p = "fs/proc/task_mmu.c"
          if os.path.exists(p):
              with open(p, "r", encoding="utf-8", errors="surrogateescape") as f:
                  s = f.read()
              # Check if the full patch is applied (declaration present)
              has_decl = "char *spoofed_redirected_name" in s
              has_usage = "spoofed_redirected_name" in s
              if has_decl and has_usage:
                  print(f"{p}: already fully patched (declaration + usage present)")
              elif has_usage and not has_decl:
                  # SUSFS patch partially applied: usage hunk succeeded but
                  # declaration hunk failed. Insert declaration after
                  # 'const char *name = NULL;' in show_map_vma().
                  print(f"{p}: usage present but declaration MISSING — fixing...")
                  lines = s.split('\n')
                  decl_anchor = "const char *name = NULL;"
                  decl_idx = None
                  for i, line in enumerate(lines):
                      if decl_anchor in line:
                          decl_idx = i
                          break
                  if decl_idx is not None:
                      decl_block = (
                          "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n"
                          "\tchar *spoofed_redirected_name = NULL;\n"
                          "#endif"
                      )
                      lines.insert(decl_idx + 1, decl_block)
                      s = '\n'.join(lines)
                      with open(p, "w", encoding="utf-8", errors="surrogateescape") as f:
                          f.write(s)
                      print(f"{p}: inserted missing declaration after line {decl_idx + 1} ✓")
                  else:
                      print(f"WARNING: '{decl_anchor}' not found in {p} — cannot insert declaration")
                      print("  Searching for show_map_vma context...")
                      for i, line in enumerate(lines):
                          if 'show_map_vma' in line:
                              start = max(0, i - 2)
                              end = min(len(lines), i + 15)
                              print(f"  Context around line {i + 1}:")
                              for j in range(start, end):
                                  marker = ">>>" if j == i else "   "
                                  print(f"    {marker} {j + 1}: {lines[j]}")
                              break
              else:
                  # No SUSFS patches at all — apply full anchor-based patch
                  anchor = (
                      "\tif (file) {\n"
                      "\t\tstruct inode *inode = file_inode(vma->vm_file);\n"
                      "\t\tdev = inode->i_sb->s_dev;\n"
                      "\t\tino = inode->i_ino;\n"
                      "\t\tpgoff = ((loff_t)vma->vm_pgoff) << PAGE_SHIFT;\n"
                      "\t}\n"
                      "\tstart = vma->vm_start;"
                  )
                  if anchor in s:
                      replacement = (
                          "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n"
                          "\tchar *spoofed_redirected_name = NULL;\n"
                          "#endif\n"
                          "\tif (file) {\n"
                          "\t\tstruct inode *inode = file_inode(vma->vm_file);\n"
                          "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n"
                          "\t\tif (SUSFS_IS_INODE_OPEN_REDIRECT(inode)) {\n"
                          "\t\t\tif (!susfs_open_redirect_spoof_show_map_vma(inode, &ino, &dev, spoofed_redirected_name)) {\n"
                          "\t\t\t\tpgoff = ((loff_t)vma->vm_pgoff) << PAGE_SHIFT;\n"
                          "\t\t\t\tgoto orig_flow;\n"
                          "\t\t\t}\n"
                          "\t\t}\n"
                          "#endif\n"
                          "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                          "\t\tif (SUSFS_IS_INODE_SUS_MAP(inode))\n"
                          "\t\t\treturn;\n"
                          "#endif\n"
                          "\t\tdev = inode->i_sb->s_dev;\n"
                          "\t\tino = inode->i_ino;\n"
                          "\t\tpgoff = ((loff_t)vma->vm_pgoff) << PAGE_SHIFT;\n"
                          "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
                          "\t\tsusfs_sus_kstat_spoof_show_map_vma(inode, &dev, &ino);\n"
                          "#endif\n"
                          "\t}\n"
                          "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n"
                          "orig_flow:\n"
                          "#endif\n"
                          "\tstart = vma->vm_start;"
                      )
                      with open(p, "w", encoding="utf-8", errors="surrogateescape") as f:
                          f.write(s.replace(anchor, replacement, 1))
                      print(f"{p}: patched manually (OPEN_REDIRECT + SUS_MAP + SUS_KSTAT)")
                  else:
                      print(f"WARNING: file/inode anchor not found in {p}")
                      print("  Searching for context around 'file_inode(vma->vm_file)'...")
                      lines = s.split('\n')
                      for i, line in enumerate(lines):
                          if 'file_inode(vma->vm_file)' in line:
                              start = max(0, i - 3)
                              end = min(len(lines), i + 8)
                              print(f"  Context around line {i + 1}:")
                              for j in range(start, end):
                                  marker = ">>>" if j == i else "   "
                                  print(f"    {marker} {j + 1}: {lines[j]}")
                              break

          # --- fs/open.c: inject missing #include <linux/susfs_def.h> ---
          # The SUSFS patch adds code using SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK
          # but forgets to add the include for susfs_def.h where the macro is defined.
          p = "fs/open.c"
          if os.path.exists(p):
              with open(p, "r", encoding="utf-8", errors="surrogateescape") as f:
                  s = f.read()
              needs_include = ("SUSFS_IS_INODE_OPEN_REDIRECT" in s or
                               "SUSFS_IS_INODE_SUS_MAP" in s or
                               "SUSFS_IS_INODE_SUS_KSTAT" in s)
              has_include = "#include <linux/susfs_def.h>" in s or "#include <linux/susfs.h>" in s
              if needs_include and not has_include:
                  lines = s.split('\n')
                  # Find last #include before first function definition
                  last_include_idx = None
                  for i, line in enumerate(lines):
                      if line.startswith('#include <'):
                          last_include_idx = i
                      if line.startswith('long ') or line.startswith('int ') or line.startswith('void '):
                          break
                  if last_include_idx is not None:
                      lines.insert(last_include_idx + 1, "#include <linux/susfs_def.h>")
                      s = '\n'.join(lines)
                      with open(p, "w", encoding="utf-8", errors="surrogateescape") as f:
                          f.write(s)
                      print(f"{p}: injected #include <linux/susfs_def.h> after line {last_include_idx + 1} ✓")
                  else:
                      print(f"WARNING: could not find include section in {p}")
              elif has_include:
                  print(f"{p}: susfs header already included ✓")
              else:
                  print(f"{p}: no SUSFS symbols found, skip include injection")

      - name: Generate defconfig
        working-directory: kernel
        run: |
          # KernelSU-Next legacy driver config (manual hook mode for non-GKI 4.19)
          # Legacy driver does NOT depend on KPROBES/EXT4_FS
          # KSU_MANUAL_HOOK defaults to y when KPROBES is disabled
          printf "%s\n" \
            "CONFIG_COMPAT=y" \
            "CONFIG_PREEMPT=y" \
            "CONFIG_KSU=y" \
            "CONFIG_KSU_MANUAL_HOOK=y" > /tmp/ksu_susfs.config

          # Add custom local version if provided
          if [ -n "${{ inputs.local_version }}" ]; then
            echo "CONFIG_LOCALVERSION=\"${{ inputs.local_version }}\"" >> /tmp/ksu_susfs.config
            echo "# CONFIG_LOCALVERSION_AUTO is not set" >> /tmp/ksu_susfs.config
            echo "Custom local version: ${{ inputs.local_version }}"
          fi

          # SUSFS options (always enabled)
          printf "%s\n" \
            "CONFIG_KSU_SUSFS=y" \
            "CONFIG_KSU_SUSFS_SUS_PATH=y" \
            "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
            "CONFIG_KSU_SUSFS_SUS_KSTAT=y" \
            "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" \
            "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" \
            "CONFIG_KSU_SUSFS_ENABLE_LOG=y" \
            "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" \
            "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" \
            "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" \
            "CONFIG_KSU_SUSFS_SUS_MAP=y" >> /tmp/ksu_susfs.config
          echo "SUSFS options enabled (all options)"

          cat arch/arm64/configs/vendor/xiaomi/sdm660_defconfig \
              arch/arm64/configs/vendor/xiaomi/clover.config \
              /tmp/ksu_susfs.config \
              > /tmp/combined_defconfig

          make O=out ARCH=$ARCH SUBARCH=$SUBARCH CC=$CC CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 KCONFIG_ALLCONFIG=/tmp/combined_defconfig alldefconfig

      - name: Fix invalid CPU mask values
        working-directory: kernel
        shell: python
        run: |
          import os
          for p in ["out/.config", "/tmp/combined_defconfig"]:
              if os.path.exists(p):
                  with open(p, "r", encoding="utf-8", errors="surrogateescape") as f:
                      s = f.read()
                  lines = [l for l in s.splitlines()
                           if "CONFIG_LITTLE_CPU_MASK" not in l
                           and "CONFIG_BIG_CPU_MASK" not in l]
                  s = "\n".join(lines)
                  s += "\nCONFIG_LITTLE_CPU_MASK=15\n"
                  s += "CONFIG_BIG_CPU_MASK=240\n"
                  with open(p, "w", encoding="utf-8", errors="surrogateescape") as f:
                      f.write(s)
                  print(f"Fixed CPU masks in {p}")

      - name: Diagnostic — show resolved KSU config
        working-directory: kernel
        run: |
          echo "=== CONFIG_KSU lines in out/.config (after alldefconfig) ==="
          grep -E "^CONFIG_KSU" out/.config || echo "no CONFIG_KSU lines found"

      - name: Fix namespace.c can_umount conflict with KSU build-time injection
        working-directory: kernel
        run: |
          # Remove the kernel's original 'static inline int can_umount()' from
          # namespace.c. KSU's build-time hook adds its own during make.
          # But the call to can_umount() at line ~1890 needs a declaration.
          # Add forward declaration in fs/internal.h (which namespace.c includes)
          # so it's visible at the call site but invisible to KSU's hook.
          python3 -c "
          import re

          # 1. Remove original can_umount from namespace.c
          with open('fs/namespace.c') as f:
              lines = f.read().split('\n')
          for i, line in enumerate(lines):
              if re.match(r'\s*static\s+inline\s+int\s+can_umount\s*\(', line):
                  brace_count = 0
                  end = i
                  for j in range(i, len(lines)):
                      brace_count += lines[j].count('{') - lines[j].count('}')
                      if brace_count == 0 and '{' in ''.join(lines[i:j+1]):
                          end = j
                          break
                  print(f'Removed original can_umount from namespace.c (lines {i+1}-{end+1})')
                  del lines[i:end+1]
                  break
          with open('fs/namespace.c', 'w') as f:
              f.write('\n'.join(lines))

          # 2. Add forward declaration to fs/internal.h
          with open('fs/internal.h') as f:
              h = f.read()
          if 'can_umount' not in h:
              # Find last #include or add at end of includes
              h_lines = h.split('\n')
              last_include = 0
              for i, line in enumerate(h_lines):
                  if line.startswith('#include'):
                      last_include = i
              fwd = (
                  '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                  'int can_umount(const struct path *path, int flags);\n'
                  '#endif'
              )
              h_lines.insert(last_include + 1, fwd)
              with open('fs/internal.h', 'w') as f:
                  f.write('\n'.join(h_lines))
              print('Added forward declaration of can_umount to fs/internal.h')
          else:
              print('can_umount already declared in fs/internal.h')
          "

      - name: Build kernel
        working-directory: kernel
        run: |
          make O=out olddefconfig ARCH=$ARCH SUBARCH=$SUBARCH CC=$CC CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

          make -j$(nproc) O=out ARCH=$ARCH SUBARCH=$SUBARCH \
            CC=$CC \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Verify KSU config in final build
        working-directory: kernel
        run: |
          echo "=== Final CONFIG_KSU lines ==="
          grep -E "^CONFIG_KSU|^# CONFIG_KSU" out/.config || echo "no CONFIG_KSU lines found"

      - name: Upload raw kernel images
        uses: actions/upload-artifact@v4
        with:
          name: raw-kernel-images
          path: |
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
