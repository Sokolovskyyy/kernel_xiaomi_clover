name: Build Clover Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: AlcatrazDev-Android-Devices/kernel_xiaomi_clover
          ref: lineage-23.1
          path: kernel

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev libelf-dev \
            build-essential git curl wget python3 cpio rsync \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Get toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Integrate ReSukiSU
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main

      - name: Apply susfs backport patch
        working-directory: kernel
        run: |
          curl -LSs -o susfs.patch "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.19.patch"
          patch -p1 --fuzz=3 < susfs.patch || true

      - name: Fix rejected susfs hunks
        working-directory: kernel
        shell: python
        run: |
          import os

          p = "fs/namespace.c"
          if os.path.exists(p):
              s = open(p).read()
              if "CONFIG_KSU_SUSFS_SUS_MOUNT" in s:
                  print("fs/namespace.c already patched")
              else:
                  anchor = "\tmnt = alloc_vfsmnt(name);\n\tif (!mnt)\n\t\treturn ERR_PTR(-ENOMEM);"
                  if anchor in s:
                      replacement = (
                          "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                          "\tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)) {\n"
                          "\t\tif (susfs_is_current_ksu_domain()) {\n"
                          "\t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(name ?: \"none\");\n"
                          "\t\t\tgoto bypass_orig_flow;\n"
                          "\t\t}\n"
                          "\t}\n"
                          "#endif\n"
                          "\tmnt = alloc_vfsmnt(name);\n\n"
                          "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                          "bypass_orig_flow:\n"
                          "#endif\n"
                          "\tif (!mnt)\n\t\treturn ERR_PTR(-ENOMEM);"
                      )
                      open(p, "w").write(s.replace(anchor, replacement, 1))
                      print("fs/namespace.c patched manually")
                  else:
                      print("Warning: anchor not found in fs/namespace.c")

          p = "fs/proc/task_mmu.c"
          if os.path.exists(p):
              s = open(p).read()
              if "CONFIG_KSU_SUSFS_OPEN_REDIRECT" in s:
                  print("fs/proc/task_mmu.c already patched")
              else:
                  anchor = (
                      "\tif (file) {\n"
                      "\t\tstruct inode *inode = file_inode(vma->vm_file);\n"
                      "\t\tdev = inode->i_sb->s_dev;\n"
                      "\t\tino = inode->i_ino;\n"
                      "\t\tpgoff = ((loff_t)vma->vm_pgoff) << PAGE_SHIFT;\n"
                      "\t}\n"
                      "\tstart = vma->vm_start;"
                  )
                  if anchor in s:
                      replacement = (
                          "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n"
                          "\tchar *spoofed_redirected_name = NULL;\n"
                          "#endif\n"
                          "\tif (file) {\n"
                          "\t\tstruct inode *inode = file_inode(vma->vm_file);\n"
                          "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n"
                          "\t\tif (SUSFS_IS_INODE_OPEN_REDIRECT(inode)) {\n"
                          "\t\t\tif (!susfs_open_redirect_spoof_show_map_vma(inode, &ino, &dev, spoofed_redirected_name)) {\n"
                          "\t\t\t\tpgoff = ((loff_t)vma->vm_pgoff) << PAGE_SHIFT;\n"
                          "\t\t\t\tgoto orig_flow;\n"
                          "\t\t\t}\n"
                          "\t\t}\n"
                          "#endif\n"
                          "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
                          "\t\tif (SUSFS_IS_INODE_SUS_MAP(inode))\n"
                          "\t\t\treturn;\n"
                          "#endif\n"
                          "\t\tdev = inode->i_sb->s_dev;\n"
                          "\t\tino = inode->i_ino;\n"
                          "\t\tpgoff = ((loff_t)vma->vm_pgoff) << PAGE_SHIFT;\n"
                          "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n"
                          "\t\tsusfs_sus_kstat_spoof_show_map_vma(inode, &dev, &ino);\n"
                          "#endif\n"
                          "\t}\n"
                          "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n"
                          "orig_flow:\n"
                          "#endif\n"
                          "\tstart = vma->vm_start;"
                      )
                      open(p, "w").write(s.replace(anchor, replacement, 1))
                      print("fs/proc/task_mmu.c patched manually")
                  else:
                      print("Warning: anchor not found in fs/proc/task_mmu.c")
                      
      - name: Set defconfig options
        working-directory: kernel
        run: |
          DEFCONFIG=arch/arm64/configs/clover_defconfig
          sed -i 's/CONFIG_PREEMPT_NONE=y/# CONFIG_PREEMPT_NONE is not set/' $DEFCONFIG
          echo "CONFIG_PREEMPT=y" >> $DEFCONFIG
          echo "CONFIG_COMPAT=y" >> $DEFCONFIG
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG

      - name: Generate defconfig
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out clover_defconfig ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Fix invalid CPU mask values
        working-directory: kernel
        shell: python
        run: |
          import os
          for p in ["out/.config", "arch/arm64/configs/clover_defconfig"]:
              if os.path.exists(p):
                  s = open(p).read()
                  lines = [l for l in s.splitlines()
                           if "CONFIG_LITTLE_CPU_MASK" not in l
                           and "CONFIG_BIG_CPU_MASK" not in l]
                  s = "\n".join(lines)
                  s += "\nCONFIG_LITTLE_CPU_MASK=15\n"
                  s += "CONFIG_BIG_CPU_MASK=240\n"
                  open(p, "w").write(s)
                  print(f"Fixed CPU masks in {p}")

      - name: Debug RCU config and source
        working-directory: kernel
        run: |
          echo "=== CONFIG_TASKS_RCU related ==="
          grep -E "CONFIG_TASKS_RCU|CONFIG_PREEMPT_RCU|CONFIG_TREE_RCU|CONFIG_TASKS_RCU_GENERIC" out/.config || echo "not set"
          echo "=== tasks.h top 40 lines ==="
          sed -n '1,40p' kernel/rcu/tasks.h
          echo "=== tasks.h around struct rcu_tasks def ==="
          grep -n "ifdef CONFIG_TASKS_RCU\|ifndef CONFIG_TASKS_RCU\|struct rcu_tasks {" kernel/rcu/tasks.h
          echo "=== update.c include of tasks.h ==="
          grep -n "tasks.h\|CONFIG_TASKS_RCU" kernel/rcu/update.c

      - name: Debug RCU tasks.h full context
        working-directory: kernel
        run: |
          echo "=== full tasks.h (400-500) ==="
          sed -n '395,500p' kernel/rcu/tasks.h
          echo "=== Kconfig TASKS_RCU definition ==="
          grep -n -A5 "config TASKS_RCU" kernel/rcu/Kconfig
          echo "=== who selects TASKS_RCU ==="
          grep -rn "select TASKS_RCU" --include="Kconfig*" .
          echo "=== CONFIG_PREEMPT in .config ==="
          grep -E "CONFIG_PREEMPT=|CONFIG_PREEMPT_NONE|CONFIG_PREEMPT_VOLUNTARY|CONFIG_PREEMPTION" out/.config

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out olddefconfig ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make -j$(nproc) O=out ARCH=arm64 SUBARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/ || cp kernel/out/arch/arm64/boot/Image ak3/
          cd ak3
          zip -r9 ../clover-kernel.zip . -x .git README.md

      - uses: actions/upload-artifact@v4
        with:
          name: clover-kernel
          path: clover-kernel.zip
